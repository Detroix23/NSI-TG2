<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Visualisation pas à pas - Boyer-Moore</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Visualisation de l’algorithme de Boyer-Moore</h1>

  <label for="text">Texte :</label><br>
  <textarea id="text" rows="4" cols="60">voici un exemple simple pour tester la recherche avec boyer moore</textarea><br>

  <label for="pattern">Motif à rechercher :</label><br>
  <input type="text" id="pattern" value="recherche"><br><br>

  <button onclick="initManual()">Initialiser</button>
  <button onclick="prevStep()">◀ Précédent</button>
  <button onclick="nextStep()">Suivant ▶</button>

  <h2>Étape :</h2>
  <pre id="visual"></pre>
  <div id="log"></div>
  
  <h3>Légende :</h3>
  <ul id="legend">
  <li><span class="char pattern">A</span> : Motif aligné</li>
  <li><span class="char match">^</span> : Correspondance (lettre identique)</li>
  <li><span class="char mismatch">x</span> : Erreur (lettre différente)</li>
</ul>

  <script src="script.js"></script>
</body>
</html>
